all:
  vars:
    ansible_user: bootstrap
    ansible_become: true

    # to be changed
    cluster_cidr: 10.50.0.0/24
    controller_ip: 10.50.0.10
    controller_fqdn: controller.lab.example

    ipa_domain: lab.example
    ipa_realm: LAB.EXAMPLE
    ipa_server_fqdn: controller.lab.example
    dns_forwarder: 1.1.1.1

    kafka_version: "4.3.1"
    spark_version: "4.2.0"
    cassandra_version: "5.0.9"
    #kafka_cluster_id: "4L6g3nShT-eMCtK--X86sw" remove zookeeper and replace the UUID

    kafka_bootstrap_servers: "10.50.0.11:9092,10.50.0.12:9092,10.50.0.13:9092"
    cassandra_hosts: "10.50.0.11,10.50.0.12,10.50.0.13"

    # reset to True after setting up ansible cluster so u dont get locked out
    enforce_hbac: false
#inventory
  children:
    controller:
      hosts:
        controller.lab.example:
          ansible_host: 10.50.0.10

    workers:
      hosts:
        node1.lab.example:
          ansible_host: 10.50.0.11
          node_id: 1
          cassandra_rack: rack1
        node2.lab.example:
          ansible_host: 10.50.0.12
          node_id: 2
          cassandra_rack: rack2
        node3.lab.example:
          ansible_host: 10.50.0.13
          node_id: 3
          cassandra_rack: rack3